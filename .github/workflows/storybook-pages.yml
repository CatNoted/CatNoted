name: Storybook to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'storybook-pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - run: corepack enable
      - run: corepack prepare pnpm@9.1.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter ./apps/web build-storybook
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - uses: actions/upload-pages-artifact@v4
        with:
          path: apps/web/storybook-static
          retention-days: 14

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
