merge_queue:
  max_parallel_checks: 20
  skip_intermediate_results: false

pull_request_rules:
  - name: automatic merge when CI passes and approved
    conditions:
      - "#approved-reviews-by>=1"
      - "#check-failure=0"
      - "#check-success-or-neutral>=1"
      - -conflict
      - base=main
    actions:
      merge:
        method: merge
        strict: smart
        commit_message: title+body
        delete_branch_on_merge: true
      rebase:
        auto: true

  - name: queue mergeable PRs
    conditions:
      - -conflict
      - "#check-failure=0"
      - "#check-success-or-neutral>=1"
      - base=main
    actions:
      queue:
        name: default
        method: merge
