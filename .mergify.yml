queue_rules:
  - name: default
    conditions:
      - "#approved-reviews-by>=1"

pull_request_rules:
  - name: automatic merge when CI passes and approved
    conditions:
      - "#approved-reviews-by>=1"
      - "#check-failure=0"
      - "#check-success-or-neutral>=1"
      - -conflict
      - base=main
    actions:
      queue:
        name: default
